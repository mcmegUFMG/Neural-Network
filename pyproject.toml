[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmeg-hopfield"
version = "0.1.0"
description = "PDD curve toolkit: fitting, Mayneord correction, kerma extraction (Hopfield/Fourier) and direct/indirect PDD reconstruction, with a PyQt5 interface."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "PyQt5",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "openpyxl",
]

[project.urls]
Homepage = "https://github.com/lsbeloti/Neural-Network"

[project.optional-dependencies]
build = ["pyinstaller"]

[project.gui-scripts]
mcmeg-hopfield = "mcmeg_hopfield.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
